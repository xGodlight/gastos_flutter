name: gestion_gastos_personales
description: MVP móvil para gestionar gastos personales, presupuestos y tickets.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^5.4.4
  cryptography: ^2.7.0
  firebase_auth: ^5.3.1
  firebase_core: ^3.6.0
  fl_chart: ^0.69.0
  flutter_local_notifications: ^17.2.3
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  intl: ^0.19.0
  path: ^1.9.0
  path_provider: ^2.1.4
  sqflite: ^2.3.3+1
  timezone: ^0.9.4
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
